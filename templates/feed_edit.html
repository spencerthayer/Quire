{% extends "base.html" %}

{% block title %}Edit Feed | Quire{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Feed</h1>
    <p>Update configuration for <strong>{{ feed.name }}</strong>.</p>
</div>

{% match error_message %}
{% when Some with (err) %}
<div class="alert alert-error" role="alert">{{ err }}</div>
{% when None %}
{% endmatch %}

<div class="card">
    <form method="post" action="/feeds/{{ feed.id }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-grid">
            <div class="form-group">
                <label for="name">Feed Name *</label>
                <input id="name" name="name" type="text" required maxlength="200" value="{{ form_name }}">
            </div>
            <div class="form-group">
                <label for="feed_url">Feed URL (RSS/Atom) *</label>
                <input id="feed_url" name="feed_url" type="url" required maxlength="2048" value="{{ form_feed_url }}">
            </div>
            <div class="form-group">
                <label for="website_url">Website URL (optional)</label>
                <input id="website_url" name="website_url" type="url" maxlength="2048" value="{{ form_website_url }}">
            </div>
            <div class="form-group">
                <label for="description">Description (optional)</label>
                <input id="description" name="description" type="text" maxlength="1000" value="{{ form_description }}">
            </div>
        </div>
        <div class="checkbox-row">
            <input id="enabled" name="enabled" type="checkbox" value="true" {% if form_enabled %}checked{% endif %}>
            <label for="enabled">Feed enabled</label>
        </div>
        <div class="actions-cell">
            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a class="btn btn-secondary" href="/feeds">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
