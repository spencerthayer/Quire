services:
  quire:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${QUIRE_IMAGE:-quire:local}
    container_name: quire
    restart: unless-stopped
    ports:
      - "${QUIRE_PORT:-8080}:8080"
    environment:
      QUIRE_HOST: "0.0.0.0"
      QUIRE_PORT: "8080"
      QUIRE_DATA_DIR: "/data"
      QUIRE_DATABASE_URL: "sqlite:///data/quire.db"
      QUIRE_LOG_LEVEL: "${QUIRE_LOG_LEVEL:-info}"
      QUIRE_TIMEZONE: "${QUIRE_TIMEZONE:-America/Los_Angeles}"
    volumes:
      - quire_data:/data
    healthcheck:
      test:
        - CMD
        - /app/quire
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  quire_data:
